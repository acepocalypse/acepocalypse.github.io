<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ace Setiawan Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #f9f9f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      justify-content: center;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 4rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 600;
      color: #222;
    }

    header p {
      font-size: 1.25rem;
      color: #555;
      margin-top: 0.5rem;
    }

    .card-fan {
      position: relative;
      width: 800px;
      height: 400px;
      perspective: 1000px;
    }

    .card {
      width: 160px;
      height: 200px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: center bottom;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .card:hover {
      transform: scale(1.08) translateY(-100px) rotate(var(--angle));
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    /* Positioning the cards in a fan layout using transform */
    .card:nth-child(1) { --angle: -35deg; transform: translateX(-80px) translateY(-50%) rotate(-35deg) translateY(-120px); background-image: url('card-about.png'); }
    .card:nth-child(2) { --angle: -25deg; transform: translateX(-80px) translateY(-50%) rotate(-25deg) translateY(-120px); background-image: url('card-projects.png'); }
    .card:nth-child(3) { --angle: -15deg; transform: translateX(-80px) translateY(-50%) rotate(-15deg) translateY(-120px); background-image: url('card-resume.png'); }
    .card:nth-child(4) { --angle: -5deg;  transform: translateX(-80px) translateY(-50%) rotate(-5deg) translateY(-120px); background-image: url('card-linkedin.png'); }
    .card:nth-child(5) { --angle: 5deg;   transform: translateX(-80px) translateY(-50%) rotate(5deg) translateY(-120px); background-image: url('card-github.png'); }
    .card:nth-child(6) { --angle: 15deg;  transform: translateX(-80px) translateY(-50%) rotate(15deg) translateY(-120px); background-image: url('card-blog.png'); }
    .card:nth-child(7) { --angle: 25deg;  transform: translateX(-80px) translateY(-50%) rotate(25deg) translateY(-120px); background-image: url('card-skills.png'); }
    .card:nth-child(8) { --angle: 35deg;  transform: translateX(-80px) translateY(-50%) rotate(35deg) translateY(-120px); background-image: url('card-contact.png'); }

    .card:nth-child(1):hover { transform: translateX(-80px) translateY(-50%) rotate(-35deg) translateY(-220px) scale(1.08); }
    .card:nth-child(2):hover { transform: translateX(-80px) translateY(-50%) rotate(-25deg) translateY(-220px) scale(1.08); }
    .card:nth-child(3):hover { transform: translateX(-80px) translateY(-50%) rotate(-15deg) translateY(-220px) scale(1.08); }
    .card:nth-child(4):hover { transform: translateX(-80px) translateY(-50%) rotate(-5deg) translateY(-220px) scale(1.08); }
    .card:nth-child(5):hover { transform: translateX(-80px) translateY(-50%) rotate(5deg) translateY(-220px) scale(1.08); }
    .card:nth-child(6):hover { transform: translateX(-80px) translateY(-50%) rotate(15deg) translateY(-220px) scale(1.08); }
    .card:nth-child(7):hover { transform: translateX(-80px) translateY(-50%) rotate(25deg) translateY(-220px) scale(1.08); }
    .card:nth-child(8):hover { transform: translateX(-80px) translateY(-50%) rotate(35deg) translateY(-220px) scale(1.08); }

    @media (max-width: 900px) {
      .card-fan {
        transform: scale(0.7);
      }
    }

    @media (max-width: 700px) {
      .card-fan {
        transform: scale(0.6);
      }
    }

    @media (max-width: 500px) {
      .card-fan {
        transform: scale(0.5);
      }
      
      header h1 {
        font-size: 2rem;
      }
      
      header p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Ace Setiawan</h1>
    <p>Python Developer and Data Analyst focused on smarter decision-making.</p>
    <p>Currently studying Business Analytics at Purdue University.</p>
  </header>

  <div class="card-fan">
    <a href="about.html" class="card"></a>
    <a href="projects.html" class="card"></a>
    <a href="resume.pdf" class="card"></a>
    <a href="https://linkedin.com/in/akmalset" class="card"></a>
    <a href="https://github.com/acepocalypse" class="card"></a>
    <a href="blog.html" class="card"></a>
    <a href="skills.html" class="card"></a>
    <a href="contact.html" class="card"></a>
  </div>
</body>
</html>
